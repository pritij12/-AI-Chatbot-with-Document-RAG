<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with your PDF</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;max-width:760px;margin:0 auto;padding:20px;background:#f5f7fb;color:#16202e;line-height:1.5}
  .box{background:#fff;border:1px solid #dde3ec;border-radius:12px;padding:16px;margin-bottom:16px}
  button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.5}
  input[type=text]{width:100%;padding:10px;border:1px solid #dde3ec;border-radius:8px;font-size:1rem;margin-bottom:8px}
  #answer{white-space:pre-wrap;min-height:40px}
  .src{border-left:4px solid #2563eb;padding:4px 10px;margin:8px 0;font-size:.9rem;color:#4a5668}
  .err{color:#c92a2a}
</style>
</head>
<body>
  <h1>📄 Chat with your PDF</h1>

  <div class="box">
    <h3>1. Upload a PDF</h3>
    <input type="file" id="file" accept=".pdf">
    <button id="uploadBtn">Upload</button>
    <button id="clearBtn" style="background:#6b7a90">Delete all</button>
    <p id="uploadMsg"></p>
    <div id="files"></div>
  </div>

  <div class="box">
    <h3>2. Ask a question</h3>
    <input type="text" id="question" placeholder="Ask something about your PDF">
    <button id="askBtn">Ask</button>
    <h4>Answer</h4>
    <div id="answer"></div>
    <div id="sources"></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

async function loadFiles() {
  const files = await (await fetch('/files')).json();
  $('files').textContent = files.length
    ? 'Uploaded: ' + files.map((f) => `${f.file} (${f.chunks} chunks)`).join(', ')
    : 'No files yet.';
}

$('uploadBtn').onclick = async () => {
  const file = $('file').files[0];
  if (!file) { $('uploadMsg').textContent = 'Choose a PDF first.'; return; }
  $('uploadMsg').textContent = 'Uploading... please wait.';
  $('uploadBtn').disabled = true;
  const form = new FormData();
  form.append('file', file);
  const res = await fetch('/upload', { method: 'POST', body: form });
  const data = await res.json();
  $('uploadMsg').textContent = res.ok ? `Done! ${data.chunks} chunks saved.` : data.error;
  $('uploadBtn').disabled = false;
  loadFiles();
};

$('clearBtn').onclick = async () => {
  await fetch('/clear', { method: 'POST' });
  $('uploadMsg').textContent = 'All documents deleted.';
  loadFiles();
};

$('askBtn').onclick = async () => {
  const question = $('question').value.trim();
  if (!question) return;
  $('answer').textContent = '';
  $('sources').textContent = '';
  $('askBtn').disabled = true;

  const res = await fetch('/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question }),
  });

  if (!res.ok) {
    const data = await res.json();
    $('answer').innerHTML = '<span class="err"></span>';
    $('answer').firstChild.textContent = data.error;
    $('askBtn').disabled = false;
    return;
  }

  // Read the streamed answer piece by piece
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split('\n\n');
    buffer = parts.pop();
    for (const part of parts) {
      if (!part.startsWith('data: ')) continue;
      const msg = JSON.parse(part.slice(6));
      if (msg.token) $('answer').textContent += msg.token;
      if (msg.error) $('answer').textContent = msg.error;
      if (msg.sources) {
        $('sources').innerHTML = '<h4>Sources</h4>';
        msg.sources.forEach((s) => {
          const div = document.createElement('div');
          div.className = 'src';
          div.textContent = `[${s.n}] ${s.file}, part ${s.part} (match ${s.score}): ${s.text}...`;
          $('sources').appendChild(div);
        });
      }
    }
  }
  $('askBtn').disabled = false;
};

$('question').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('askBtn').click(); });
loadFiles();
</script>
</body>
</html>
